schema: spec-driven

context: |
  NOME-DO-PROJETO: descreva em uma frase o que o projeto e, para quem, e o dominio.
  Pilha decidida: (preencha quando a etapa 6 da esteira decidir; ate la, vazio).
  Cofre de segredos: (preencha quando decidido).
  Ambientes: dev e producao. Caminho do codigo: GitHub flow (branch curta a partir da main, pedido de juncao para a main).
  Quem le e o dono do projeto. Ele le o texto, nao o codigo: escreva o efeito, nao o mecanismo.
  Decisoes duradouras ficam em esteira/decisoes (skill adr) e no OpenSpec, na mudanca que as tomou. Regras de trabalho ficam em AGENTS.md.

rules:
  proposal:
    - Português do Brasil, com acentos. Uma ideia por frase.
    - Proibido travessão e traço médio. Use ponto, vírgula, dois-pontos ou parênteses.
    - Todo fato sobre o sistema traz a medição (arquivo:linha ou saída literal) e a data.
    - Antes de propor, confira se a premissa ainda é verdade no código de hoje.
  specs:
    - Português do Brasil, com acentos, sem travessão nem traço médio.
    - Quando o código ainda não faz o que a regra manda, a primeira linha é o selo AINDA NÃO VALE, com o que o código faz hoje e a data.
    - Tabela só quando houver dois lados a comparar. Frases curtas com SHALL e NÃO SHALL. "Por quê:" em uma linha. "Decisão:" apontando para a mudança do OpenSpec que decidiu, quando existir.
    - Histórico de edição não entra no corpo da regra.
  design:
    - Português do Brasil, sem travessão nem traço médio.
    - Arquitetura se desenha em bloco de código, com caixas e setas.
  tasks:
    - Cada tarefa diz como validar e como reverter.
    - Tarefa que só o dono pode fazer leva [DONO] e o motivo.
    - Tarefa que chega a produção passa antes pelo dev.
